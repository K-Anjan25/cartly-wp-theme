  <script src="/_sdk/0aac212797dcb9a6.editing_sdk.js" integrity="sha512-U1Z5TGB/MTX0fFSADhP7rVM3+UzJJjKTapiY1vm1cxcbcyWo4eBuCJNJO6zARJ5kHopP9UvWNtPszOqzRc1ICA=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();

      const mobileMenuButton = document.getElementById("mobile-menu-button");
      const mobileMenu = document.getElementById("mobile-menu");
      const preview = document.getElementById("demo-preview");
      const hidePreviewButton = document.getElementById("hide-preview-button");

      mobileMenuButton.addEventListener("click", function () {
        const expanded = mobileMenuButton.getAttribute("aria-expanded") === "true";
        mobileMenuButton.setAttribute("aria-expanded", String(!expanded));
        mobileMenu.classList.toggle("hidden", expanded);
        mobileMenu.classList.toggle("mobile-nav-open", !expanded);
      });

      document.querySelectorAll("#mobile-menu a").forEach(function (link) {
        link.addEventListener("click", function () {
          mobileMenu.classList.add("hidden");
          mobileMenu.classList.remove("mobile-nav-open");
          mobileMenuButton.setAttribute("aria-expanded", "false");
        });
      });

      function showPreview() {
        preview.classList.remove("preview-hidden");
        preview.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      ["header-demo-button", "mobile-demo-button", "hero-demo-button", "closing-demo-button"].forEach(function (id) {
        document.getElementById(id).addEventListener("click", showPreview);
      });

      hidePreviewButton.addEventListener("click", function () {
        preview.classList.add("preview-hidden");
      });
    });
  </script>
