name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './bridge/node_modules/*' -print0 \
            | xargs -0 -n1 php -l

  app-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Seed the demo database
        run: php bin/seed.php

      - name: Boot the app and smoke-test routes
        run: |
          php -S 0.0.0.0:8080 -t public >/tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null' EXIT
          sleep 2
          for route in "/" "/login"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$route")
            echo "$route -> $code"
            test "$code" = "200"
          done
